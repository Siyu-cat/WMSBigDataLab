server {
    listen 80;
    server_name _;

    # 后端限制 50MB 上传，nginx 需略大
    client_max_body_size 60m;

    root /usr/share/nginx/html;
    index index.html;

    # 后端 API 反向代理（Spring Boot :8080）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # 图片/文件直链兜底：/uploads/xxx → 后端 /api/media/uploads/xxx
    location /uploads/ {
        proxy_pass http://backend:8080/api/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 老链接兼容：历史根级路径（/entry/xxx、/search）重写到 /bigdatalab/
    # 注：/admin 已归主页管理后台，不再重写到百科
    location ~ ^/(entry|search)(/.*)?$ {
        rewrite ^/(.*)$ /bigdatalab/$1 last;
    }

    # 百科构建产物带内容 hash，可安全长缓存
    location /bigdatalab/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版立即生效
    location = /bigdatalab/index.html {
        add_header Cache-Control "no-cache";
    }

    # 百科站点 SPA 路由回退（dist 位于 /usr/share/nginx/html/bigdatalab）
    location /bigdatalab/ {
        try_files $uri $uri/ /bigdatalab/index.html;
    }

    # 主页（根路径 SPA）：构建产物带内容 hash，可安全长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 主页 SPA 路由回退（/、/s?keyword= 等）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
